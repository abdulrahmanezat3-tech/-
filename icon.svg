<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="masryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.25" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#masryGrad)" />

  <!-- Inner receipt card simulation -->
  <g filter="url(#shadow)">
    <!-- Back receipt -->
    <rect x="140" y="80" width="240" height="340" rx="20" fill="#ffffff" opacity="0.4" transform="rotate(-6 260 250)" />
    <!-- Front receipt -->
    <rect x="136" y="96" width="240" height="320" rx="20" fill="#ffffff" />
    
    <!-- Receipt details lines -->
    <rect x="166" y="136" width="180" height="20" rx="10" fill="#059669" />
    
    <circle cx="256" cy="210" r="30" fill="#ecfdf5" />
    <path d="M244 210 L252 218 L268 202" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    
    <rect x="166" y="260" width="180" height="8" rx="4" fill="#cbd5e1" />
    <rect x="166" y="280" width="120" height="8" rx="4" fill="#e2e8f0" />
    <rect x="166" y="300" width="150" height="8" rx="4" fill="#e2e8f0" />
    
    <!-- Cut dashed line at bottom -->
    <line x1="150" y1="360" x2="362" y2="360" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 6" />
    
    <!-- Arabic Letter Meem in bold artistic style -->
    <text x="256" y="405" font-family="'Cairo', sans-serif" font-size="28" font-weight="900" fill="#0f172a" text-anchor="middle">المصري</text>
  </g>
</svg>
